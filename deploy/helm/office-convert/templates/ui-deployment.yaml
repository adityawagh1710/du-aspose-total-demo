{{- if .Values.ui.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "office-convert.uiFullname" . }}
  labels:
    {{- include "office-convert.uiLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ui.replicaCount }}
  selector:
    matchLabels:
      {{- include "office-convert.uiSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "office-convert.uiSelectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.ui.podSecurityContext | nindent 8 }}
      containers:
        - name: office-convert-ui
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.ui.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              # Next.js standalone server (ui/Dockerfile sets PORT=3000).
              containerPort: 3000
              protocol: TCP
          env:
            # UI → API path for the server-side /api proxy: in-cluster
            # service DNS, read at runtime by app/api/[...path]/route.ts.
            - name: API_URL
              value: "http://{{ include "office-convert.fullname" . }}:{{ .Values.service.port }}"
            # Browser-facing URL of the API's /v1/dashboard, embedded as an
            # iframe and allowed in the CSP frame-src. The browser can't
            # resolve the in-cluster DNS above, so set `ui.publicApiUrl` to
            # the API Ingress hostname. Read at request time (page.tsx is
            # force-dynamic), so no image rebuild is needed.
            - name: NEXT_PUBLIC_DASHBOARD_URL
              value: {{ printf "%s/v1/dashboard" (.Values.ui.publicApiUrl | default (printf "http://%s:%v" (include "office-convert.fullname" .) .Values.service.port)) | quote }}
            - name: NEXT_PUBLIC_S3_ENABLED
              value: {{ .Values.s3.enabled | quote }}
            {{- with .Values.s3.defaultOutputBucket }}
            - name: NEXT_PUBLIC_S3_OUTPUT_BUCKET
              value: {{ . | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              # The dashboard root; the image's own HEALTHCHECK uses it too.
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          # Writable paths under the read-only root filesystem.
          volumeMounts:
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: next-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
